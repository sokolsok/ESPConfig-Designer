name: Build standalone Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "esp-config-designer/**"
      - "scripts/docker-runtime-gate.sh"
      - "scripts/version-contract.mjs"
      - "VERSION"
      - "CHANGELOG.md"
      - ".github/workflows/docker-standalone.yml"
  workflow_dispatch:

concurrency:
  group: docker-publication-${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'edge' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Validate publication ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" && ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Publication is allowed only from main or a canonical version tag." >&2
            exit 1
          fi

  quality:
    needs: validate-ref
    uses: ./.github/workflows/quality.yml

  desktop:
    needs: validate-ref
    uses: ./.github/workflows/desktop-windows.yml

  docker:
    needs:
      - quality
      - desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Verify release version
        run: node scripts/version-contract.mjs

      - name: Read canonical version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 # qemu-v9.2.2
          platforms: arm64

      - name: Build and run both images on linux/amd64
        env:
          DOCKER_PLATFORM: linux/amd64
        run: bash scripts/docker-runtime-gate.sh

      - name: Build and run both images on linux/arm64
        env:
          DOCKER_PLATFORM: linux/arm64
        run: bash scripts/docker-runtime-gate.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Protect immutable release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          IMAGE: ghcr.io/sokolsok/esp-config-designer
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if output="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"; then
            echo "::error::Release image $IMAGE:$VERSION already exists and is immutable."
            exit 1
          fi
          if ! grep -Eiq 'manifest unknown|not found' <<< "$output"; then
            echo "$output" >&2
            echo "::error::Could not verify immutable release tag availability."
            exit 1
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/sokolsok/esp-config-designer
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./esp-config-designer
          file: ./esp-config-designer/Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
