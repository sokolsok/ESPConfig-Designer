name: Quality gates

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Verify product version
        run: |
          node scripts/version-contract.mjs
          node --test scripts/tests/versionContract.test.mjs

      - name: Verify Compose source split
        run: node --test docker/tests/composeContract.test.mjs

  frontend-shared:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: esp-config-designer/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: esp-config-designer/frontend
        run: npm ci

      - name: Verify shared schema catalog
        working-directory: esp-config-designer/frontend
        run: npm run check:catalog

      - name: Run frontend and shared tests
        working-directory: esp-config-designer/frontend
        run: npm test

      - name: Build production frontend
        working-directory: esp-config-designer/frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: desktop/platforms/windows/requirements-runtime.txt

      - name: Install backend test dependencies
        run: python -m pip install Flask==3.1.2 pyserial==3.5

      - name: Run backend tests
        working-directory: esp-config-designer/backend
        env:
          TARGET_DIR: ${{ runner.temp }}/ecd-backend/target
          PROJECT_DIR: ${{ runner.temp }}/ecd-backend/target/esp_projects
          ASSET_ROOT: ${{ runner.temp }}/ecd-backend/target/esp_assets
          JOB_DIR: ${{ runner.temp }}/ecd-backend/jobs
          ESPHOME_DATA_DIR: ${{ runner.temp }}/ecd-backend/esphome-data
          ESPHOME_CONFIG_DIR: ${{ runner.temp }}/ecd-backend/esphome-config
          DEVICES_PATH: ${{ runner.temp }}/ecd-backend/devices.json
          WEB_ROOT: ${{ runner.temp }}/ecd-backend/web
          SCHEMA_CATALOG_ROOT: ${{ github.workspace }}/esp-config-designer/shared/schema-catalog
          SEED_ROOT: ${{ github.workspace }}/esp-config-designer/backend/seed_esphome
        run: python -I -B -m unittest discover -s tests -v

      - name: Check backend syntax
        working-directory: esp-config-designer/backend
        run: >-
          python -I -B -m py_compile
          runtime_contract.py
          runtime_manifest.py
          runtime_diagnostics.py
          server.py
